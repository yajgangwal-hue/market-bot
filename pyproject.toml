[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-aware-trader"
version = "0.3.0"
description = "Event-aware, long-only paper-trading research and backtesting tool"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Local research project"}]
dependencies = [
  "yfinance>=0.2.40,<1",
]

[project.optional-dependencies]
dev = []

[project.scripts]
event-aware-trader = "event_aware_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
